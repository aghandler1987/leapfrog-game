<?xml version="1.0" encoding="UTF-8"?>
<!-- Frog 7: FAT bulbous bullfrog — super wide low body, little legs, double chin. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Palette: black / dark olive / olive green / pale yellow belly / white eyes -->

  <!-- Row 0: squat small head top -->
  <rect x="5" y="0" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="0" width="4" height="1" fill="#4a5810"/>
  <rect x="10" y="0" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 1: eyes close together, low on wide face -->
  <rect x="4" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5" y="1" width="1" height="1" fill="#4a5810"/>
  <rect x="6" y="1" width="1" height="1" fill="#fcfcfc"/>
  <rect x="7" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="8" y="1" width="1" height="1" fill="#fcfcfc"/>
  <rect x="9" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="10" y="1" width="1" height="1" fill="#4a5810"/>
  <rect x="11" y="1" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 2: start widening head -->
  <rect x="3" y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="4" y="2" width="8" height="1" fill="#4a5810"/>
  <rect x="12" y="2" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 3: wide frown -->
  <rect x="2" y="3" width="1" height="1" fill="#0d0d0d"/>
  <rect x="3" y="3" width="2" height="1" fill="#4a5810"/>
  <rect x="5" y="3" width="6" height="1" fill="#0d0d0d"/>
  <rect x="11" y="3" width="2" height="1" fill="#4a5810"/>
  <rect x="13" y="3" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 4: huge wide body starts (full width) + double chin pale yellow -->
  <rect x="1" y="4" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="4" width="3" height="1" fill="#4a5810"/>
  <rect x="5" y="4" width="6" height="1" fill="#fcd800"/>
  <rect x="11" y="4" width="3" height="1" fill="#4a5810"/>
  <rect x="14" y="4" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 5-9: FAT body, full width -->
  <rect x="0" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="5" width="4" height="1" fill="#4a5810"/>
  <rect x="5" y="5" width="6" height="1" fill="#fcd800"/>
  <rect x="11" y="5" width="4" height="1" fill="#4a5810"/>
  <rect x="15" y="5" width="1" height="1" fill="#0d0d0d"/>

  <rect x="0" y="6" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="6" width="4" height="1" fill="#4a5810"/>
  <rect x="5" y="6" width="6" height="1" fill="#f8e8c8"/>
  <rect x="11" y="6" width="4" height="1" fill="#4a5810"/>
  <rect x="15" y="6" width="1" height="1" fill="#0d0d0d"/>

  <rect x="0" y="7" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="7" width="4" height="1" fill="#4a5810"/>
  <rect x="5" y="7" width="6" height="1" fill="#f8e8c8"/>
  <rect x="11" y="7" width="4" height="1" fill="#4a5810"/>
  <rect x="15" y="7" width="1" height="1" fill="#0d0d0d"/>

  <rect x="0" y="8" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="8" width="4" height="1" fill="#4a5810"/>
  <rect x="5" y="8" width="6" height="1" fill="#f8e8c8"/>
  <rect x="11" y="8" width="4" height="1" fill="#4a5810"/>
  <rect x="15" y="8" width="1" height="1" fill="#0d0d0d"/>

  <rect x="0" y="9" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="9" width="4" height="1" fill="#4a5810"/>
  <rect x="5" y="9" width="6" height="1" fill="#f8e8c8"/>
  <rect x="11" y="9" width="4" height="1" fill="#4a5810"/>
  <rect x="15" y="9" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 10: body starts tapering -->
  <rect x="0" y="10" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="10" width="4" height="1" fill="#4a5810"/>
  <rect x="5" y="10" width="6" height="1" fill="#f8e8c8"/>
  <rect x="11" y="10" width="4" height="1" fill="#4a5810"/>
  <rect x="15" y="10" width="1" height="1" fill="#0d0d0d"/>

  <rect x="1" y="11" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="11" width="3" height="1" fill="#4a5810"/>
  <rect x="5" y="11" width="6" height="1" fill="#4a5810"/>
  <rect x="11" y="11" width="3" height="1" fill="#4a5810"/>
  <rect x="14" y="11" width="1" height="1" fill="#0d0d0d"/>

  <!-- Little tucked legs — tiny -->
  <rect x="2" y="12" width="1" height="1" fill="#0d0d0d"/>
  <rect x="3" y="12" width="2" height="1" fill="#4a5810"/>
  <rect x="5" y="12" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="12" width="4" height="1" fill="#4a5810"/>
  <rect x="10" y="12" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="12" width="2" height="1" fill="#4a5810"/>
  <rect x="13" y="12" width="1" height="1" fill="#0d0d0d"/>

  <!-- Small toes - only three per foot since the frog is so wide the legs are tucked -->
  <rect x="2" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="3" y="13" width="1" height="1" fill="#4a5810"/>
  <rect x="4" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="7" y="13" width="1" height="1" fill="#4a5810"/>
  <rect x="8" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="9" y="13" width="1" height="1" fill="#4a5810"/>
  <rect x="10" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="13" width="1" height="1" fill="#4a5810"/>
  <rect x="12" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="13" y="13" width="1" height="1" fill="#0d0d0d"/>
</svg>

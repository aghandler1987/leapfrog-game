<?xml version="1.0" encoding="UTF-8"?>
<!-- Fish — pixel art, 20x12. Faces right. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 12" shape-rendering="crispEdges">
  <!-- Palette: black / dark orange / orange / white / dark red -->
  <!-- Tail -->
  <rect x="0" y="3" width="1" height="1" fill="#0d0d0d"/>
  <rect x="0" y="7" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="3" width="1" height="1" fill="#fc9838"/>
  <rect x="1" y="4" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="6" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="7" width="1" height="1" fill="#fc9838"/>
  <rect x="2" y="4" width="1" height="1" fill="#fc9838"/>
  <rect x="2" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="6" width="1" height="1" fill="#fc9838"/>
  <rect x="3" y="5" width="1" height="1" fill="#0d0d0d"/>

  <!-- Body top edge -->
  <rect x="4" y="3" width="4" height="1" fill="#0d0d0d"/>
  <rect x="8" y="2" width="4" height="1" fill="#0d0d0d"/>
  <rect x="12" y="3" width="4" height="1" fill="#0d0d0d"/>

  <!-- Body middle (orange) -->
  <rect x="3" y="4" width="2" height="1" fill="#fc9838"/>
  <rect x="5" y="4" width="7" height="1" fill="#d82800"/>
  <rect x="12" y="4" width="4" height="1" fill="#fc9838"/>
  <rect x="16" y="4" width="1" height="1" fill="#0d0d0d"/>

  <!-- Center stripe + white dot (gill) + eye -->
  <rect x="4" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5" y="5" width="9" height="1" fill="#fc9838"/>
  <rect x="14" y="5" width="2" height="1" fill="#fcfcfc"/>
  <rect x="15" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="16" y="5" width="1" height="1" fill="#d82800"/>
  <rect x="17" y="5" width="1" height="1" fill="#0d0d0d"/>

  <!-- Fin -->
  <rect x="4" y="6" width="2" height="1" fill="#fc9838"/>
  <rect x="6" y="6" width="2" height="1" fill="#d82800"/>
  <rect x="8" y="6" width="4" height="1" fill="#fc9838"/>
  <rect x="12" y="6" width="4" height="1" fill="#d82800"/>
  <rect x="16" y="6" width="1" height="1" fill="#0d0d0d"/>

  <!-- Body bottom (orange) -->
  <rect x="4" y="7" width="3" height="1" fill="#fc9838"/>
  <rect x="7" y="7" width="5" height="1" fill="#d82800"/>
  <rect x="12" y="7" width="4" height="1" fill="#fc9838"/>
  <rect x="16" y="7" width="1" height="1" fill="#0d0d0d"/>

  <!-- Body bottom edge -->
  <rect x="4" y="8" width="4" height="1" fill="#0d0d0d"/>
  <rect x="8" y="9" width="4" height="1" fill="#0d0d0d"/>
  <rect x="12" y="8" width="4" height="1" fill="#0d0d0d"/>
</svg>

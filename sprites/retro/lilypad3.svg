<?xml version="1.0" encoding="UTF-8"?>
<!-- Lilypad 3: darker green with blue flower + notch on the RIGHT side. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 10" shape-rendering="crispEdges">
  <!-- Row 0: dark pad with blue flower on top-left -->
  <rect x="5"  y="0" width="2" height="1" fill="#58d8f8"/>
  <rect x="7"  y="0" width="2" height="1" fill="#0d0d0d"/>
  <rect x="9"  y="0" width="14" height="1" fill="#58d858"/>
  <rect x="23" y="0" width="2" height="1" fill="#0d0d0d"/>

  <rect x="4"  y="1" width="2" height="1" fill="#0d0d0d"/>
  <rect x="6"  y="1" width="2" height="1" fill="#fcfcfc"/>
  <rect x="8"  y="1" width="1" height="1" fill="#006818"/>
  <rect x="9"  y="1" width="14" height="1" fill="#00a800"/>
  <rect x="23" y="1" width="2" height="1" fill="#006818"/>
  <rect x="25" y="1" width="2" height="1" fill="#0d0d0d"/>

  <rect x="2"  y="2" width="2" height="1" fill="#0d0d0d"/>
  <rect x="4"  y="2" width="3" height="1" fill="#006818"/>
  <rect x="7"  y="2" width="18" height="1" fill="#006818"/>
  <rect x="25" y="2" width="3" height="1" fill="#006818"/>
  <rect x="28" y="2" width="2" height="1" fill="#0d0d0d"/>

  <!-- Row 3: notch on RIGHT -->
  <rect x="1"  y="3" width="2" height="1" fill="#0d0d0d"/>
  <rect x="3"  y="3" width="20" height="1" fill="#006818"/>
  <rect x="23" y="3" width="2" height="1" fill="#1e4e6b"/>
  <rect x="25" y="3" width="4" height="1" fill="#006818"/>
  <rect x="29" y="3" width="2" height="1" fill="#0d0d0d"/>

  <!-- Row 4: widest with notch -->
  <rect x="0"  y="4" width="2" height="1" fill="#0d0d0d"/>
  <rect x="2"  y="4" width="20" height="1" fill="#006818"/>
  <rect x="22" y="4" width="5" height="1" fill="#1e4e6b"/>
  <rect x="27" y="4" width="3" height="1" fill="#006818"/>
  <rect x="30" y="4" width="2" height="1" fill="#0d0d0d"/>

  <!-- Row 5: notch narrows -->
  <rect x="1"  y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2"  y="5" width="21" height="1" fill="#004410"/>
  <rect x="23" y="5" width="3" height="1" fill="#1e4e6b"/>
  <rect x="26" y="5" width="4" height="1" fill="#004410"/>
  <rect x="30" y="5" width="1" height="1" fill="#0d0d0d"/>

  <rect x="2"  y="6" width="2" height="1" fill="#0d0d0d"/>
  <rect x="4"  y="6" width="24" height="1" fill="#004410"/>
  <rect x="28" y="6" width="2" height="1" fill="#0d0d0d"/>

  <rect x="4"  y="7" width="3" height="1" fill="#0d0d0d"/>
  <rect x="7"  y="7" width="18" height="1" fill="#004410"/>
  <rect x="25" y="7" width="3" height="1" fill="#0d0d0d"/>

  <rect x="7"  y="8" width="2" height="1" fill="#0d0d0d"/>
  <rect x="9"  y="8" width="14" height="1" fill="#004410"/>
  <rect x="23" y="8" width="2" height="1" fill="#0d0d0d"/>

  <rect x="10" y="9" width="2" height="1" fill="#58d8f8" opacity="0.3"/>
  <rect x="15" y="9" width="5" height="1" fill="#58d8f8" opacity="0.3"/>
</svg>

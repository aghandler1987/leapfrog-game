<?xml version="1.0" encoding="UTF-8"?>
<!-- Dragonfly — pixel art, 16x10. Faces right. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10" shape-rendering="crispEdges">
  <!-- Palette: black / dark cyan / cyan / white wings / dark eye -->

  <!-- Wings top -->
  <rect x="2" y="0" width="2" height="1" fill="#58d8f8"/>
  <rect x="4" y="1" width="2" height="1" fill="#58d8f8"/>
  <rect x="8" y="0" width="2" height="1" fill="#58d8f8"/>
  <rect x="10" y="1" width="2" height="1" fill="#58d8f8"/>

  <!-- Wings mid with white sheen -->
  <rect x="3" y="2" width="1" height="1" fill="#fcfcfc"/>
  <rect x="4" y="2" width="1" height="1" fill="#58d8f8"/>
  <rect x="5" y="2" width="1" height="1" fill="#fcfcfc"/>
  <rect x="9" y="2" width="1" height="1" fill="#fcfcfc"/>
  <rect x="10" y="2" width="1" height="1" fill="#58d8f8"/>
  <rect x="11" y="2" width="1" height="1" fill="#fcfcfc"/>

  <!-- Body top -->
  <rect x="0" y="4" width="6" height="1" fill="#0d0d0d"/>
  <rect x="6" y="4" width="1" height="1" fill="#0d0d0d"/>
  <rect x="7" y="4" width="5" height="1" fill="#0d0d0d"/>
  <rect x="12" y="4" width="2" height="1" fill="#0d0d0d"/>

  <!-- Body (long thin tail going left; head on right) -->
  <rect x="0" y="5" width="12" height="1" fill="#2d8470"/>
  <rect x="12" y="5" width="2" height="1" fill="#58d8f8"/>
  <rect x="14" y="5" width="1" height="1" fill="#0d0d0d"/>

  <!-- Body bottom -->
  <rect x="0" y="6" width="12" height="1" fill="#0d0d0d"/>
  <rect x="12" y="6" width="2" height="1" fill="#0d0d0d"/>

  <!-- Lower wings mirrored -->
  <rect x="3" y="7" width="1" height="1" fill="#fcfcfc"/>
  <rect x="4" y="7" width="1" height="1" fill="#58d8f8"/>
  <rect x="5" y="7" width="1" height="1" fill="#fcfcfc"/>
  <rect x="9" y="7" width="1" height="1" fill="#fcfcfc"/>
  <rect x="10" y="7" width="1" height="1" fill="#58d8f8"/>
  <rect x="11" y="7" width="1" height="1" fill="#fcfcfc"/>

  <rect x="2" y="8" width="2" height="1" fill="#58d8f8"/>
  <rect x="4" y="9" width="2" height="1" fill="#58d8f8"/>
  <rect x="8" y="8" width="2" height="1" fill="#58d8f8"/>
  <rect x="10" y="9" width="2" height="1" fill="#58d8f8"/>
</svg>

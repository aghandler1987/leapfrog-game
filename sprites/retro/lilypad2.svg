<?xml version="1.0" encoding="UTF-8"?>
<!-- Lilypad 2: smaller round pad, no notch, pink flower on left. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 10" shape-rendering="crispEdges">
  <!-- Row 0: narrower top, flower bud on left -->
  <rect x="4"  y="0" width="2" height="1" fill="#ff6680"/>
  <rect x="9"  y="0" width="2" height="1" fill="#0d0d0d"/>
  <rect x="11" y="0" width="10" height="1" fill="#a0d848"/>
  <rect x="21" y="0" width="2" height="1" fill="#0d0d0d"/>

  <!-- Row 1 -->
  <rect x="3"  y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="4"  y="1" width="2" height="1" fill="#fcd800"/>
  <rect x="6"  y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="7"  y="1" width="2" height="1" fill="#0d0d0d"/>
  <rect x="9"  y="1" width="2" height="1" fill="#58d858"/>
  <rect x="11" y="1" width="10" height="1" fill="#58d858"/>
  <rect x="21" y="1" width="2" height="1" fill="#58d858"/>
  <rect x="23" y="1" width="2" height="1" fill="#0d0d0d"/>

  <!-- Row 2 -->
  <rect x="5"  y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6"  y="2" width="1" height="1" fill="#00a800"/>
  <rect x="7"  y="2" width="2" height="1" fill="#58d858"/>
  <rect x="9"  y="2" width="16" height="1" fill="#00a800"/>
  <rect x="25" y="2" width="2" height="1" fill="#0d0d0d"/>

  <!-- Row 3: widest -->
  <rect x="4"  y="3" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5"  y="3" width="2" height="1" fill="#00a800"/>
  <rect x="7"  y="3" width="2" height="1" fill="#58d858"/>
  <rect x="9"  y="3" width="18" height="1" fill="#00a800"/>
  <rect x="27" y="3" width="1" height="1" fill="#006818"/>
  <rect x="28" y="3" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 4 -->
  <rect x="3"  y="4" width="1" height="1" fill="#0d0d0d"/>
  <rect x="4"  y="4" width="24" height="1" fill="#006818"/>
  <rect x="28" y="4" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 5 -->
  <rect x="4"  y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5"  y="5" width="22" height="1" fill="#006818"/>
  <rect x="27" y="5" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 6 -->
  <rect x="5"  y="6" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6"  y="6" width="20" height="1" fill="#004410"/>
  <rect x="26" y="6" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 7 -->
  <rect x="7"  y="7" width="1" height="1" fill="#0d0d0d"/>
  <rect x="8"  y="7" width="16" height="1" fill="#004410"/>
  <rect x="24" y="7" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 8 -->
  <rect x="9"  y="8" width="2" height="1" fill="#0d0d0d"/>
  <rect x="11" y="8" width="10" height="1" fill="#004410"/>
  <rect x="21" y="8" width="2" height="1" fill="#0d0d0d"/>

  <!-- Row 9: reflection -->
  <rect x="11" y="9" width="3" height="1" fill="#58d858" opacity="0.4"/>
  <rect x="16" y="9" width="4" height="1" fill="#58d858" opacity="0.4"/>
</svg>

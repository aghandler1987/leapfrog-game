<?xml version="1.0" encoding="UTF-8"?>
<!-- Player frog — 16x16 pixel art, NES palette. Faces right. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Palette:
       #0d0d0d  black outline
       #00a800  dark green (body shade)
       #58d858  bright green (body)
       #a0d848  pale lime (belly)
       #fcfcfc  white (eye)
       #d82800  red (mouth)
  -->

  <!-- Row 0: eyes top -->
  <rect x="3" y="0" width="2" height="1" fill="#0d0d0d"/>
  <rect x="10" y="0" width="2" height="1" fill="#0d0d0d"/>

  <!-- Row 1: eye whites -->
  <rect x="2" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="3" y="1" width="2" height="1" fill="#fcfcfc"/>
  <rect x="5" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="9" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="10" y="1" width="2" height="1" fill="#fcfcfc"/>
  <rect x="12" y="1" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 2: eye pupils + head top -->
  <rect x="2" y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="3" y="2" width="1" height="1" fill="#fcfcfc"/>
  <rect x="4" y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5" y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="2" width="3" height="1" fill="#58d858"/>
  <rect x="9" y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="10" y="2" width="1" height="1" fill="#fcfcfc"/>
  <rect x="11" y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="12" y="2" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 3: head starts widening -->
  <rect x="1" y="3" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="3" width="3" height="1" fill="#58d858"/>
  <rect x="5" y="3" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="3" width="3" height="1" fill="#58d858"/>
  <rect x="9" y="3" width="1" height="1" fill="#0d0d0d"/>
  <rect x="10" y="3" width="3" height="1" fill="#58d858"/>
  <rect x="13" y="3" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 4: full head width, mouth hint -->
  <rect x="1" y="4" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="4" width="4" height="1" fill="#58d858"/>
  <rect x="6" y="4" width="4" height="1" fill="#00a800"/>
  <rect x="10" y="4" width="3" height="1" fill="#58d858"/>
  <rect x="13" y="4" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 5: mouth line -->
  <rect x="0" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="5" width="5" height="1" fill="#58d858"/>
  <rect x="6" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="7" y="5" width="2" height="1" fill="#d82800"/>
  <rect x="9" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="10" y="5" width="4" height="1" fill="#58d858"/>
  <rect x="14" y="5" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 6: body top (belly starts) -->
  <rect x="0" y="6" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="6" width="4" height="1" fill="#58d858"/>
  <rect x="5" y="6" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="6" width="4" height="1" fill="#a0d848"/>
  <rect x="10" y="6" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="6" width="3" height="1" fill="#58d858"/>
  <rect x="14" y="6" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 7: body + belly -->
  <rect x="0" y="7" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="7" width="4" height="1" fill="#58d858"/>
  <rect x="5" y="7" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="7" width="4" height="1" fill="#a0d848"/>
  <rect x="10" y="7" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="7" width="3" height="1" fill="#58d858"/>
  <rect x="14" y="7" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 8: body bottom -->
  <rect x="1" y="8" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="8" width="3" height="1" fill="#58d858"/>
  <rect x="5" y="8" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="8" width="4" height="1" fill="#a0d848"/>
  <rect x="10" y="8" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="8" width="2" height="1" fill="#58d858"/>
  <rect x="13" y="8" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 9: legs starting -->
  <rect x="1" y="9" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="9" width="2" height="1" fill="#00a800"/>
  <rect x="4" y="9" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5" y="9" width="1" height="1" fill="#58d858"/>
  <rect x="6" y="9" width="4" height="1" fill="#a0d848"/>
  <rect x="10" y="9" width="1" height="1" fill="#58d858"/>
  <rect x="11" y="9" width="1" height="1" fill="#0d0d0d"/>
  <rect x="12" y="9" width="2" height="1" fill="#00a800"/>
  <rect x="14" y="9" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 10: thigh / belly bottom -->
  <rect x="0" y="10" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="10" width="3" height="1" fill="#00a800"/>
  <rect x="4" y="10" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5" y="10" width="1" height="1" fill="#58d858"/>
  <rect x="6" y="10" width="4" height="1" fill="#58d858"/>
  <rect x="10" y="10" width="1" height="1" fill="#58d858"/>
  <rect x="11" y="10" width="1" height="1" fill="#0d0d0d"/>
  <rect x="12" y="10" width="3" height="1" fill="#00a800"/>
  <rect x="15" y="10" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 11: feet forming -->
  <rect x="0" y="11" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="11" width="3" height="1" fill="#00a800"/>
  <rect x="4" y="11" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5" y="11" width="6" height="1" fill="#58d858"/>
  <rect x="11" y="11" width="1" height="1" fill="#0d0d0d"/>
  <rect x="12" y="11" width="3" height="1" fill="#00a800"/>
  <rect x="15" y="11" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 12: feet -->
  <rect x="0" y="12" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="12" width="4" height="1" fill="#00a800"/>
  <rect x="5" y="12" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="12" width="4" height="1" fill="#00a800"/>
  <rect x="10" y="12" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="12" width="4" height="1" fill="#00a800"/>
  <rect x="15" y="12" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 13: toe tips -->
  <rect x="0" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="13" width="1" height="1" fill="#58d858"/>
  <rect x="2" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="3" y="13" width="1" height="1" fill="#58d858"/>
  <rect x="4" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="13" width="1" height="1" fill="#58d858"/>
  <rect x="7" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="8" y="13" width="1" height="1" fill="#58d858"/>
  <rect x="9" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="10" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="13" width="1" height="1" fill="#58d858"/>
  <rect x="12" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="13" y="13" width="1" height="1" fill="#58d858"/>
  <rect x="14" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="15" y="13" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 14: bottom edge of toes -->
  <rect x="1" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="3" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="8" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="13" y="14" width="1" height="1" fill="#0d0d0d"/>
</svg>

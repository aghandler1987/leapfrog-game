<?xml version="1.0" encoding="UTF-8"?>
<!-- Boss frog — 16x16 pixel art, menacing red/purple palette. Faces right by default.
     In the DOM we flip it with scaleX(-1) so it faces the player. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Palette:
       #0d0d0d  black outline
       #4a0808  dark red (body shade)
       #d82800  bright red (body)
       #fc9838  orange (belly / warts)
       #fcd800  yellow (angry eyes)
       #0d0d0d  black pupils
  -->

  <!-- Horns/spikes on head top -->
  <rect x="2" y="0" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="0" width="1" height="1" fill="#0d0d0d"/>
  <rect x="9" y="0" width="1" height="1" fill="#0d0d0d"/>
  <rect x="13" y="0" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 1: more horn, eye tops -->
  <rect x="1" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="1" width="1" height="1" fill="#4a0808"/>
  <rect x="3" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="1" width="1" height="1" fill="#4a0808"/>
  <rect x="7" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="8" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="9" y="1" width="1" height="1" fill="#4a0808"/>
  <rect x="10" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="12" y="1" width="1" height="1" fill="#0d0d0d"/>
  <rect x="13" y="1" width="1" height="1" fill="#4a0808"/>
  <rect x="14" y="1" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 2: head top -->
  <rect x="1" y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="2" width="3" height="1" fill="#d82800"/>
  <rect x="5" y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="2" width="3" height="1" fill="#d82800"/>
  <rect x="9" y="2" width="1" height="1" fill="#0d0d0d"/>
  <rect x="10" y="2" width="3" height="1" fill="#d82800"/>
  <rect x="13" y="2" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 3: angry eye slits start -->
  <rect x="0" y="3" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="3" width="2" height="1" fill="#d82800"/>
  <rect x="3" y="3" width="2" height="1" fill="#fcd800"/>
  <rect x="5" y="3" width="1" height="1" fill="#d82800"/>
  <rect x="6" y="3" width="4" height="1" fill="#d82800"/>
  <rect x="10" y="3" width="1" height="1" fill="#d82800"/>
  <rect x="11" y="3" width="2" height="1" fill="#fcd800"/>
  <rect x="13" y="3" width="1" height="1" fill="#d82800"/>
  <rect x="14" y="3" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 4: pupil row with angry downward slant -->
  <rect x="0" y="4" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="4" width="1" height="1" fill="#d82800"/>
  <rect x="2" y="4" width="1" height="1" fill="#fcd800"/>
  <rect x="3" y="4" width="1" height="1" fill="#0d0d0d"/>
  <rect x="4" y="4" width="1" height="1" fill="#fcd800"/>
  <rect x="5" y="4" width="1" height="1" fill="#d82800"/>
  <rect x="6" y="4" width="4" height="1" fill="#d82800"/>
  <rect x="10" y="4" width="1" height="1" fill="#d82800"/>
  <rect x="11" y="4" width="1" height="1" fill="#fcd800"/>
  <rect x="12" y="4" width="1" height="1" fill="#0d0d0d"/>
  <rect x="13" y="4" width="1" height="1" fill="#fcd800"/>
  <rect x="14" y="4" width="1" height="1" fill="#d82800"/>
  <rect x="15" y="4" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 5: mean mouth with fangs -->
  <rect x="0" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="5" width="4" height="1" fill="#d82800"/>
  <rect x="5" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="5" width="1" height="1" fill="#fcfcfc"/>
  <rect x="7" y="5" width="2" height="1" fill="#0d0d0d"/>
  <rect x="9" y="5" width="1" height="1" fill="#fcfcfc"/>
  <rect x="10" y="5" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="5" width="4" height="1" fill="#d82800"/>
  <rect x="15" y="5" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 6: wart on body + belly starts -->
  <rect x="0" y="6" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="6" width="1" height="1" fill="#d82800"/>
  <rect x="2" y="6" width="1" height="1" fill="#fc9838"/>
  <rect x="3" y="6" width="2" height="1" fill="#d82800"/>
  <rect x="5" y="6" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="6" width="4" height="1" fill="#fc9838"/>
  <rect x="10" y="6" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="6" width="2" height="1" fill="#d82800"/>
  <rect x="13" y="6" width="1" height="1" fill="#fc9838"/>
  <rect x="14" y="6" width="1" height="1" fill="#d82800"/>
  <rect x="15" y="6" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 7: body wide -->
  <rect x="0" y="7" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="7" width="4" height="1" fill="#d82800"/>
  <rect x="5" y="7" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="7" width="4" height="1" fill="#fc9838"/>
  <rect x="10" y="7" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="7" width="4" height="1" fill="#d82800"/>
  <rect x="15" y="7" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 8: body with another wart -->
  <rect x="0" y="8" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="8" width="2" height="1" fill="#d82800"/>
  <rect x="3" y="8" width="1" height="1" fill="#fc9838"/>
  <rect x="4" y="8" width="1" height="1" fill="#d82800"/>
  <rect x="5" y="8" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="8" width="4" height="1" fill="#fc9838"/>
  <rect x="10" y="8" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="8" width="1" height="1" fill="#d82800"/>
  <rect x="12" y="8" width="1" height="1" fill="#fc9838"/>
  <rect x="13" y="8" width="2" height="1" fill="#d82800"/>
  <rect x="15" y="8" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 9: body base + legs starting -->
  <rect x="1" y="9" width="1" height="1" fill="#0d0d0d"/>
  <rect x="2" y="9" width="3" height="1" fill="#4a0808"/>
  <rect x="5" y="9" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="9" width="4" height="1" fill="#d82800"/>
  <rect x="10" y="9" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="9" width="3" height="1" fill="#4a0808"/>
  <rect x="14" y="9" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 10: legs -->
  <rect x="0" y="10" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="10" width="4" height="1" fill="#4a0808"/>
  <rect x="5" y="10" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="10" width="4" height="1" fill="#d82800"/>
  <rect x="10" y="10" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="10" width="4" height="1" fill="#4a0808"/>
  <rect x="15" y="10" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 11: leg bulges -->
  <rect x="0" y="11" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="11" width="4" height="1" fill="#4a0808"/>
  <rect x="5" y="11" width="6" height="1" fill="#d82800"/>
  <rect x="11" y="11" width="4" height="1" fill="#4a0808"/>
  <rect x="15" y="11" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 12: feet with claws -->
  <rect x="0" y="12" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="12" width="4" height="1" fill="#4a0808"/>
  <rect x="5" y="12" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="12" width="4" height="1" fill="#4a0808"/>
  <rect x="10" y="12" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="12" width="4" height="1" fill="#4a0808"/>
  <rect x="15" y="12" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 13: claws / toes -->
  <rect x="0" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="1" y="13" width="1" height="1" fill="#fcd800"/>
  <rect x="2" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="3" y="13" width="1" height="1" fill="#fcd800"/>
  <rect x="4" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="5" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="13" width="1" height="1" fill="#fcd800"/>
  <rect x="7" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="8" y="13" width="1" height="1" fill="#fcd800"/>
  <rect x="9" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="10" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="13" width="1" height="1" fill="#fcd800"/>
  <rect x="12" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="13" y="13" width="1" height="1" fill="#fcd800"/>
  <rect x="14" y="13" width="1" height="1" fill="#0d0d0d"/>
  <rect x="15" y="13" width="1" height="1" fill="#0d0d0d"/>

  <!-- Row 14: claw tips -->
  <rect x="1" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="3" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="6" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="8" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="11" y="14" width="1" height="1" fill="#0d0d0d"/>
  <rect x="13" y="14" width="1" height="1" fill="#0d0d0d"/>
</svg>

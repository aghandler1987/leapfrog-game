<?xml version="1.0" encoding="UTF-8"?>
<!-- Answer fly: wide oval body (viewed from above/front), big red compound eyes
     on the front, translucent wings sweeping back to the sides, 6 tiny legs.
     Body panel in the middle for a text label. 44x28 grid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 28" shape-rendering="crispEdges">
  <!-- Palette:
       #0d0d0d outline
       #2a2a2a body shade (dark grey)
       #4a4a4a body (grey)
       #787878 body highlight
       #a8e8ff wing (translucent cyan)
       #58d8f8 wing shade
       #d82800 compound eye red
       #ff6680 eye highlight
       #fcfcfc white
  -->

  <!-- ============== LEFT WING ============== -->
  <!-- Thin outlined wing arcing out to the left behind the body -->
  <rect x="2"  y="4" width="6"  height="1" fill="#0d0d0d"/>
  <rect x="0"  y="5" width="2"  height="1" fill="#0d0d0d"/>
  <rect x="2"  y="5" width="8"  height="1" fill="#a8e8ff"/>
  <rect x="10" y="5" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="0"  y="6" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="1"  y="6" width="10" height="1" fill="#a8e8ff"/>
  <rect x="11" y="6" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="1"  y="7" width="11" height="1" fill="#58d8f8"/>
  <rect x="12" y="7" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="2"  y="8" width="10" height="1" fill="#58d8f8"/>
  <rect x="12" y="8" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="4"  y="9" width="8"  height="1" fill="#0d0d0d"/>

  <!-- ============== RIGHT WING ============== -->
  <rect x="36" y="4" width="6"  height="1" fill="#0d0d0d"/>
  <rect x="34" y="5" width="2"  height="1" fill="#0d0d0d"/>
  <rect x="42" y="5" width="2"  height="1" fill="#0d0d0d"/>
  <rect x="34" y="5" width="10" height="1" fill="#a8e8ff"/>
  <rect x="43" y="6" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="33" y="6" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="33" y="6" width="11" height="1" fill="#a8e8ff"/>
  <rect x="32" y="7" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="32" y="7" width="12" height="1" fill="#58d8f8"/>
  <rect x="32" y="8" width="11" height="1" fill="#58d8f8"/>
  <rect x="31" y="8" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="32" y="9" width="9"  height="1" fill="#0d0d0d"/>

  <!-- ============== BODY — fat oval ============== -->
  <!-- Top edge of body -->
  <rect x="16" y="7"  width="12" height="1" fill="#0d0d0d"/>
  <rect x="14" y="8"  width="16" height="1" fill="#0d0d0d"/>
  <rect x="13" y="9"  width="18" height="1" fill="#0d0d0d"/>

  <!-- Body fill rows -->
  <rect x="12" y="10" width="1"  height="10" fill="#0d0d0d"/>
  <rect x="13" y="10" width="18" height="1"  fill="#2a2a2a"/>
  <rect x="31" y="10" width="1"  height="10" fill="#0d0d0d"/>

  <!-- Big red compound eyes on the FRONT, flanking the top -->
  <rect x="14" y="10" width="4" height="1" fill="#2a2a2a"/>
  <rect x="18" y="10" width="2" height="1" fill="#787878"/>
  <rect x="20" y="10" width="4" height="1" fill="#2a2a2a"/>
  <rect x="24" y="10" width="2" height="1" fill="#787878"/>
  <rect x="26" y="10" width="4" height="1" fill="#2a2a2a"/>

  <rect x="13" y="11" width="2" height="2" fill="#4a4a4a"/>
  <rect x="15" y="11" width="4" height="2" fill="#d82800"/>
  <rect x="19" y="11" width="6" height="2" fill="#4a4a4a"/>
  <rect x="25" y="11" width="4" height="2" fill="#d82800"/>
  <rect x="29" y="11" width="2" height="2" fill="#4a4a4a"/>

  <!-- Eye highlights (white glint top-left of each eye) -->
  <rect x="15" y="11" width="1" height="1" fill="#ff6680"/>
  <rect x="25" y="11" width="1" height="1" fill="#ff6680"/>
  <rect x="16" y="11" width="1" height="1" fill="#fcfcfc"/>
  <rect x="26" y="11" width="1" height="1" fill="#fcfcfc"/>

  <!-- Body middle rows (panel for text) -->
  <rect x="13" y="13" width="18" height="1" fill="#4a4a4a"/>
  <rect x="13" y="14" width="18" height="1" fill="#787878"/>
  <rect x="13" y="15" width="18" height="1" fill="#787878"/>
  <rect x="13" y="16" width="18" height="1" fill="#4a4a4a"/>
  <rect x="13" y="17" width="18" height="1" fill="#4a4a4a"/>

  <!-- Body bottom narrows a bit -->
  <rect x="13" y="18" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="14" y="18" width="16" height="1" fill="#2a2a2a"/>
  <rect x="30" y="18" width="1"  height="1" fill="#0d0d0d"/>

  <rect x="13" y="19" width="1"  height="1" fill="#0d0d0d"/>
  <rect x="14" y="19" width="16" height="1" fill="#0d0d0d"/>
  <rect x="30" y="19" width="1"  height="1" fill="#0d0d0d"/>

  <rect x="15" y="20" width="14" height="1" fill="#0d0d0d"/>
  <rect x="17" y="21" width="10" height="1" fill="#0d0d0d"/>

  <!-- ============== LEGS (6 thin legs underneath) ============== -->
  <rect x="14" y="22" width="1" height="2" fill="#0d0d0d"/>
  <rect x="13" y="24" width="1" height="1" fill="#0d0d0d"/>
  <rect x="17" y="22" width="1" height="2" fill="#0d0d0d"/>
  <rect x="16" y="24" width="1" height="1" fill="#0d0d0d"/>
  <rect x="20" y="22" width="1" height="2" fill="#0d0d0d"/>
  <rect x="19" y="24" width="1" height="1" fill="#0d0d0d"/>
  <rect x="23" y="22" width="1" height="2" fill="#0d0d0d"/>
  <rect x="24" y="24" width="1" height="1" fill="#0d0d0d"/>
  <rect x="26" y="22" width="1" height="2" fill="#0d0d0d"/>
  <rect x="27" y="24" width="1" height="1" fill="#0d0d0d"/>
  <rect x="29" y="22" width="1" height="2" fill="#0d0d0d"/>
  <rect x="30" y="24" width="1" height="1" fill="#0d0d0d"/>
</svg>

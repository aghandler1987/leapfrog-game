<?xml version="1.0" encoding="UTF-8"?>
<!-- Modern SEMI-REALISTIC frog — natural proportions, muted greens, textured. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Back color — mottled olive green -->
    <radialGradient id="bodyRealGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#7a8e3c"/>
      <stop offset="60%" stop-color="#4e6624"/>
      <stop offset="100%" stop-color="#263316"/>
    </radialGradient>
    <!-- Pale yellowish belly -->
    <linearGradient id="bellyRealGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"  stop-color="#e8dfa8"/>
      <stop offset="100%" stop-color="#b8ad70"/>
    </linearGradient>
    <!-- Dark eye membrane -->
    <radialGradient id="eyeRealGrad" cx="40%" cy="40%" r="70%">
      <stop offset="0%"  stop-color="#d4b84a"/>
      <stop offset="50%" stop-color="#8a6a1a"/>
      <stop offset="100%" stop-color="#3a2a08"/>
    </radialGradient>
    <!-- Spotty back pattern -->
    <pattern id="spots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="2.5" fill="#2a3614" opacity="0.5"/>
      <circle cx="14" cy="15" r="1.8" fill="#2a3614" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Hind legs tucked at sides (crouched pose) -->
  <path d="M 20 165 Q 10 125 30 110 Q 55 105 60 150 Q 55 175 20 165 Z" fill="#4e6624"/>
  <path d="M 180 165 Q 190 125 170 110 Q 145 105 140 150 Q 145 175 180 165 Z" fill="#4e6624"/>

  <!-- Hind feet with long toes -->
  <path d="M 15 170 L 5 175 L 10 180 L 18 177 M 10 180 L 2 185 L 8 190 L 15 182 M 15 182 L 5 190 L 12 195 L 20 188"
        stroke="#263316" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 185 170 L 195 175 L 190 180 L 182 177 M 190 180 L 198 185 L 192 190 L 185 182 M 185 182 L 195 190 L 188 195 L 180 188"
        stroke="#263316" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Belly / underside -->
  <ellipse cx="100" cy="150" rx="55" ry="40" fill="url(#bellyRealGrad)"/>

  <!-- Body top (back, visible from above) -->
  <path d="M 40 130 Q 40 70 100 65 Q 160 70 160 130 Q 160 165 100 170 Q 40 165 40 130 Z" fill="url(#bodyRealGrad)"/>
  <!-- Spot overlay on back -->
  <path d="M 40 130 Q 40 70 100 65 Q 160 70 160 130 Q 160 165 100 170 Q 40 165 40 130 Z" fill="url(#spots)"/>

  <!-- Dorsal shading line (slight ridge down the back) -->
  <path d="M 100 68 Q 100 100 100 140" stroke="#263316" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Front legs peeking out -->
  <ellipse cx="55"  cy="170" rx="15" ry="7" fill="#4e6624" transform="rotate(-20 55 170)"/>
  <ellipse cx="145" cy="170" rx="15" ry="7" fill="#4e6624" transform="rotate(20 145 170)"/>
  <!-- Front toes -->
  <path d="M 42 173 L 36 178 M 45 176 L 40 182 M 48 178 L 44 184" stroke="#263316" stroke-width="3" stroke-linecap="round"/>
  <path d="M 158 173 L 164 178 M 155 176 L 160 182 M 152 178 L 156 184" stroke="#263316" stroke-width="3" stroke-linecap="round"/>

  <!-- Eye sockets (bulbous, raised from skull) -->
  <ellipse cx="68"  cy="55" rx="20" ry="22" fill="url(#bodyRealGrad)"/>
  <ellipse cx="132" cy="55" rx="20" ry="22" fill="url(#bodyRealGrad)"/>

  <!-- Eyeballs (gold with vertical slit pupil — classic frog eye) -->
  <ellipse cx="68"  cy="52" rx="15" ry="17" fill="url(#eyeRealGrad)"/>
  <ellipse cx="132" cy="52" rx="15" ry="17" fill="url(#eyeRealGrad)"/>

  <!-- Vertical slit pupils (bufonid style) -->
  <ellipse cx="68"  cy="52" rx="3" ry="13" fill="#0a0a0a"/>
  <ellipse cx="132" cy="52" rx="3" ry="13" fill="#0a0a0a"/>

  <!-- Eye highlights -->
  <ellipse cx="63"  cy="45" rx="3" ry="4" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="127" cy="45" rx="3" ry="4" fill="#ffffff" opacity="0.8"/>

  <!-- Tympanum (ear disc, visible behind each eye) -->
  <circle cx="42" cy="80" r="7" fill="#2a3614" opacity="0.6"/>
  <circle cx="158" cy="80" r="7" fill="#2a3614" opacity="0.6"/>

  <!-- Mouth — subtle thin line, slight downturn at corners -->
  <path d="M 55 115 Q 100 125 145 115" stroke="#1a1a1a" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Nostrils -->
  <circle cx="94"  cy="88" r="1.5" fill="#1a1a1a"/>
  <circle cx="106" cy="88" r="1.5" fill="#1a1a1a"/>

  <!-- Soft shadow under body -->
  <ellipse cx="100" cy="195" rx="60" ry="4" fill="#000" opacity="0.2"/>
</svg>

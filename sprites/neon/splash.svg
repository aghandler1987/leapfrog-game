<?xml version="1.0" encoding="UTF-8"?>
<!-- Neon splash — cyan burst with pink ripples. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 16" shape-rendering="crispEdges">
  <!-- Flying droplets -->
  <rect x="2" y="1" width="2" height="2" fill="#58d8f8"/>
  <rect x="10" y="0" width="3" height="3" fill="#58d8f8"/>
  <rect x="19" y="1" width="2" height="2" fill="#58d8f8"/>
  <rect x="0" y="7" width="2" height="2" fill="#58d8f8"/>
  <rect x="22" y="7" width="2" height="2" fill="#58d8f8"/>

  <!-- Main burst -->
  <rect x="7"  y="5" width="2" height="1" fill="#58d8f8"/>
  <rect x="9"  y="5" width="6" height="1" fill="#2a1040"/>
  <rect x="15" y="5" width="2" height="1" fill="#58d8f8"/>

  <rect x="5"  y="6" width="2" height="1" fill="#58d8f8"/>
  <rect x="7"  y="6" width="10" height="1" fill="#2a1040"/>
  <rect x="17" y="6" width="2" height="1" fill="#58d8f8"/>

  <rect x="4"  y="7" width="1" height="1" fill="#58d8f8"/>
  <rect x="5"  y="7" width="14" height="1" fill="#2a1040"/>
  <rect x="19" y="7" width="1" height="1" fill="#58d8f8"/>

  <rect x="4"  y="8" width="1" height="1" fill="#58d8f8"/>
  <rect x="5"  y="8" width="14" height="1" fill="#2a1040"/>
  <rect x="19" y="8" width="1" height="1" fill="#58d8f8"/>

  <rect x="5"  y="9" width="2" height="1" fill="#58d8f8"/>
  <rect x="7"  y="9" width="10" height="1" fill="#2a1040"/>
  <rect x="17" y="9" width="2" height="1" fill="#58d8f8"/>

  <rect x="7"  y="10" width="2" height="1" fill="#58d8f8"/>
  <rect x="9"  y="10" width="6" height="1" fill="#2a1040"/>
  <rect x="15" y="10" width="2" height="1" fill="#58d8f8"/>

  <!-- Pink ripple -->
  <rect x="3"  y="11" width="2" height="1" fill="#ff6680" opacity="0.6"/>
  <rect x="9"  y="11" width="6" height="1" fill="#ff6680" opacity="0.8"/>
  <rect x="19" y="11" width="2" height="1" fill="#ff6680" opacity="0.6"/>

  <rect x="2"  y="12" width="3" height="1" fill="#ff6680" opacity="0.5"/>
  <rect x="19" y="12" width="3" height="1" fill="#ff6680" opacity="0.5"/>

  <rect x="1"  y="13" width="4" height="1" fill="#ff6680" opacity="0.35"/>
  <rect x="19" y="13" width="4" height="1" fill="#ff6680" opacity="0.35"/>

  <rect x="11" y="14" width="2" height="1" fill="#58d8f8"/>
  <rect x="11" y="15" width="2" height="1" fill="#58d8f8"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- Neon dragonfly — cyan body, pink wings. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10" shape-rendering="crispEdges">
  <!-- Wings top -->
  <rect x="2" y="0" width="2" height="1" fill="#ff6680"/>
  <rect x="4" y="1" width="2" height="1" fill="#ff6680"/>
  <rect x="8" y="0" width="2" height="1" fill="#ff6680"/>
  <rect x="10" y="1" width="2" height="1" fill="#ff6680"/>
  <!-- Wing tips -->
  <rect x="3" y="2" width="1" height="1" fill="#ff6680"/>
  <rect x="5" y="2" width="1" height="1" fill="#ff6680"/>
  <rect x="9" y="2" width="1" height="1" fill="#ff6680"/>
  <rect x="11" y="2" width="1" height="1" fill="#ff6680"/>

  <!-- Body outline -->
  <rect x="0" y="4" width="12" height="1" fill="#58d8f8"/>
  <rect x="12" y="4" width="2" height="1" fill="#58d8f8"/>

  <rect x="0" y="5" width="14" height="1" fill="#2a1040"/>
  <rect x="12" y="5" width="2" height="1" fill="#fcd800"/>
  <rect x="14" y="5" width="1" height="1" fill="#58d8f8"/>

  <rect x="0" y="6" width="12" height="1" fill="#58d8f8"/>
  <rect x="12" y="6" width="2" height="1" fill="#58d8f8"/>

  <!-- Wings bottom -->
  <rect x="3" y="7" width="1" height="1" fill="#ff6680"/>
  <rect x="5" y="7" width="1" height="1" fill="#ff6680"/>
  <rect x="9" y="7" width="1" height="1" fill="#ff6680"/>
  <rect x="11" y="7" width="1" height="1" fill="#ff6680"/>
  <rect x="2" y="8" width="2" height="1" fill="#ff6680"/>
  <rect x="4" y="9" width="2" height="1" fill="#ff6680"/>
  <rect x="8" y="8" width="2" height="1" fill="#ff6680"/>
  <rect x="10" y="9" width="2" height="1" fill="#ff6680"/>
</svg>

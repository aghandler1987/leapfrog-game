<?xml version="1.0" encoding="UTF-8"?>
<!-- Neon fish — cyan outline, dark fill, pink eye. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 12" shape-rendering="crispEdges">
  <!-- Tail -->
  <rect x="0" y="3" width="1" height="1" fill="#58d8f8"/>
  <rect x="0" y="7" width="1" height="1" fill="#58d8f8"/>
  <rect x="1" y="3" width="1" height="1" fill="#2a1040"/>
  <rect x="1" y="4" width="1" height="1" fill="#58d8f8"/>
  <rect x="1" y="6" width="1" height="1" fill="#58d8f8"/>
  <rect x="1" y="7" width="1" height="1" fill="#2a1040"/>
  <rect x="2" y="4" width="1" height="1" fill="#2a1040"/>
  <rect x="2" y="5" width="1" height="1" fill="#58d8f8"/>
  <rect x="2" y="6" width="1" height="1" fill="#2a1040"/>
  <rect x="3" y="5" width="1" height="1" fill="#58d8f8"/>

  <!-- Body top edge -->
  <rect x="4" y="3" width="12" height="1" fill="#58d8f8"/>

  <!-- Body middle -->
  <rect x="3" y="4" width="1" height="1" fill="#58d8f8"/>
  <rect x="4" y="4" width="12" height="1" fill="#2a1040"/>
  <rect x="16" y="4" width="1" height="1" fill="#58d8f8"/>

  <rect x="3" y="5" width="1" height="1" fill="#58d8f8"/>
  <rect x="4" y="5" width="10" height="1" fill="#2a1040"/>
  <rect x="14" y="5" width="1" height="1" fill="#ff6680"/>
  <rect x="15" y="5" width="1" height="1" fill="#2a1040"/>
  <rect x="16" y="5" width="1" height="1" fill="#58d8f8"/>

  <rect x="3" y="6" width="1" height="1" fill="#58d8f8"/>
  <rect x="4" y="6" width="12" height="1" fill="#2a1040"/>
  <rect x="16" y="6" width="1" height="1" fill="#58d8f8"/>

  <rect x="3" y="7" width="1" height="1" fill="#58d8f8"/>
  <rect x="4" y="7" width="12" height="1" fill="#2a1040"/>
  <rect x="16" y="7" width="1" height="1" fill="#58d8f8"/>

  <!-- Body bottom -->
  <rect x="4" y="8" width="12" height="1" fill="#58d8f8"/>
</svg>

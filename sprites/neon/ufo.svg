<?xml version="1.0" encoding="UTF-8"?>
<!-- Neon UFO with abducted frog — cyan body, pink lights, green beam. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 18" shape-rendering="crispEdges">
  <!-- Dome top -->
  <rect x="9"  y="0" width="6" height="1" fill="#58d8f8"/>
  <rect x="8"  y="1" width="1" height="1" fill="#58d8f8"/>
  <rect x="9"  y="1" width="6" height="1" fill="#2a1040"/>
  <rect x="15" y="1" width="1" height="1" fill="#58d8f8"/>
  <rect x="7"  y="2" width="1" height="1" fill="#58d8f8"/>
  <rect x="8"  y="2" width="8" height="1" fill="#ff6680"/>
  <rect x="16" y="2" width="1" height="1" fill="#58d8f8"/>
  <rect x="7"  y="3" width="1" height="1" fill="#58d8f8"/>
  <rect x="8"  y="3" width="8" height="1" fill="#2a1040"/>
  <rect x="16" y="3" width="1" height="1" fill="#58d8f8"/>

  <!-- Rim -->
  <rect x="2"  y="4" width="2" height="1" fill="#58d8f8"/>
  <rect x="4"  y="4" width="3" height="1" fill="#2a1040"/>
  <rect x="7"  y="4" width="1" height="1" fill="#58d8f8"/>
  <rect x="8"  y="4" width="8" height="1" fill="#2a1040"/>
  <rect x="16" y="4" width="1" height="1" fill="#58d8f8"/>
  <rect x="17" y="4" width="3" height="1" fill="#2a1040"/>
  <rect x="20" y="4" width="2" height="1" fill="#58d8f8"/>

  <!-- Body with blinking pink lights -->
  <rect x="1"  y="5" width="1" height="1" fill="#58d8f8"/>
  <rect x="2"  y="5" width="4" height="1" fill="#2a1040"/>
  <rect x="6"  y="5" width="1" height="1" fill="#ff6680"/>
  <rect x="7"  y="5" width="2" height="1" fill="#2a1040"/>
  <rect x="9"  y="5" width="1" height="1" fill="#fcd800"/>
  <rect x="10" y="5" width="3" height="1" fill="#2a1040"/>
  <rect x="13" y="5" width="1" height="1" fill="#ff6680"/>
  <rect x="14" y="5" width="2" height="1" fill="#2a1040"/>
  <rect x="16" y="5" width="1" height="1" fill="#fcd800"/>
  <rect x="17" y="5" width="4" height="1" fill="#2a1040"/>
  <rect x="21" y="5" width="1" height="1" fill="#58d8f8"/>

  <rect x="1"  y="6" width="1" height="1" fill="#58d8f8"/>
  <rect x="2"  y="6" width="19" height="1" fill="#2a1040"/>
  <rect x="21" y="6" width="1" height="1" fill="#58d8f8"/>

  <rect x="2"  y="7" width="2" height="1" fill="#58d8f8"/>
  <rect x="4"  y="7" width="15" height="1" fill="#2a1040"/>
  <rect x="19" y="7" width="2" height="1" fill="#58d8f8"/>

  <!-- Green beam -->
  <rect x="9"  y="8" width="6" height="1" fill="#00ff88" opacity="0.6"/>
  <rect x="9"  y="9" width="6" height="1" fill="#00ff88" opacity="0.6"/>
  <rect x="8"  y="10" width="8" height="1" fill="#00ff88" opacity="0.5"/>
  <rect x="8"  y="11" width="8" height="1" fill="#00ff88" opacity="0.4"/>
  <rect x="7"  y="12" width="10" height="1" fill="#00ff88" opacity="0.3"/>

  <!-- Abducted frog -->
  <rect x="10" y="13" width="1" height="1" fill="#58d8f8"/>
  <rect x="11" y="13" width="2" height="1" fill="#2a1040"/>
  <rect x="13" y="13" width="1" height="1" fill="#58d8f8"/>
  <rect x="9"  y="14" width="1" height="1" fill="#58d8f8"/>
  <rect x="10" y="14" width="1" height="1" fill="#fcfcfc"/>
  <rect x="11" y="14" width="2" height="1" fill="#2a1040"/>
  <rect x="13" y="14" width="1" height="1" fill="#fcfcfc"/>
  <rect x="14" y="14" width="1" height="1" fill="#58d8f8"/>
  <rect x="9"  y="15" width="1" height="1" fill="#58d8f8"/>
  <rect x="10" y="15" width="4" height="1" fill="#2a1040"/>
  <rect x="14" y="15" width="1" height="1" fill="#58d8f8"/>
  <rect x="10" y="16" width="1" height="1" fill="#58d8f8"/>
  <rect x="11" y="16" width="2" height="1" fill="#2a1040"/>
  <rect x="13" y="16" width="1" height="1" fill="#58d8f8"/>
</svg>

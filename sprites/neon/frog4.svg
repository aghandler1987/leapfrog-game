<?xml version="1.0" encoding="UTF-8"?>
<!-- Neon frog — thin cyan outline, dark navy fill. CSS adds the glow. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Palette: dark navy fill, cyan outline, hot pink highlights -->

  <!-- Eyes top -->
  <rect x="3" y="0" width="2" height="1" fill="#ff6680"/>
  <rect x="11" y="0" width="2" height="1" fill="#ff6680"/>

  <!-- Eye rings -->
  <rect x="2" y="1" width="1" height="1" fill="#ff6680"/>
  <rect x="3" y="1" width="2" height="1" fill="#0e2a56"/>
  <rect x="5" y="1" width="1" height="1" fill="#ff6680"/>
  <rect x="10" y="1" width="1" height="1" fill="#ff6680"/>
  <rect x="11" y="1" width="2" height="1" fill="#0e2a56"/>
  <rect x="13" y="1" width="1" height="1" fill="#ff6680"/>

  <!-- Pupils (bright pink glow) + head top -->
  <rect x="2" y="2" width="1" height="1" fill="#ff6680"/>
  <rect x="3" y="2" width="2" height="1" fill="#fcd800"/>
  <rect x="5" y="2" width="1" height="1" fill="#ff6680"/>
  <rect x="6" y="2" width="4" height="1" fill="#0e2a56"/>
  <rect x="10" y="2" width="1" height="1" fill="#ff6680"/>
  <rect x="11" y="2" width="2" height="1" fill="#fcd800"/>
  <rect x="13" y="2" width="1" height="1" fill="#ff6680"/>

  <!-- Head widens -->
  <rect x="1" y="3" width="1" height="1" fill="#ff6680"/>
  <rect x="2" y="3" width="3" height="1" fill="#0e2a56"/>
  <rect x="5" y="3" width="1" height="1" fill="#ff6680"/>
  <rect x="6" y="3" width="4" height="1" fill="#0e2a56"/>
  <rect x="10" y="3" width="1" height="1" fill="#ff6680"/>
  <rect x="11" y="3" width="3" height="1" fill="#0e2a56"/>
  <rect x="14" y="3" width="1" height="1" fill="#ff6680"/>

  <!-- Head full -->
  <rect x="1" y="4" width="1" height="1" fill="#ff6680"/>
  <rect x="2" y="4" width="12" height="1" fill="#0e2a56"/>
  <rect x="14" y="4" width="1" height="1" fill="#ff6680"/>

  <!-- Mouth with pink glow -->
  <rect x="0" y="5" width="1" height="1" fill="#ff6680"/>
  <rect x="1" y="5" width="5" height="1" fill="#0e2a56"/>
  <rect x="6" y="5" width="1" height="1" fill="#ff6680"/>
  <rect x="7" y="5" width="2" height="1" fill="#fcd800"/>
  <rect x="9" y="5" width="1" height="1" fill="#ff6680"/>
  <rect x="10" y="5" width="4" height="1" fill="#0e2a56"/>
  <rect x="14" y="5" width="1" height="1" fill="#ff6680"/>

  <!-- Body -->
  <rect x="0" y="6" width="1" height="1" fill="#ff6680"/>
  <rect x="1" y="6" width="13" height="1" fill="#0e2a56"/>
  <rect x="14" y="6" width="1" height="1" fill="#ff6680"/>

  <rect x="0" y="7" width="1" height="1" fill="#ff6680"/>
  <rect x="1" y="7" width="13" height="1" fill="#0e2a56"/>
  <rect x="14" y="7" width="1" height="1" fill="#ff6680"/>

  <rect x="1" y="8" width="1" height="1" fill="#ff6680"/>
  <rect x="2" y="8" width="11" height="1" fill="#0e2a56"/>
  <rect x="13" y="8" width="1" height="1" fill="#ff6680"/>

  <!-- Legs start -->
  <rect x="1" y="9" width="1" height="1" fill="#ff6680"/>
  <rect x="2" y="9" width="2" height="1" fill="#0e2a56"/>
  <rect x="4" y="9" width="1" height="1" fill="#ff6680"/>
  <rect x="5" y="9" width="6" height="1" fill="#0e2a56"/>
  <rect x="11" y="9" width="1" height="1" fill="#ff6680"/>
  <rect x="12" y="9" width="2" height="1" fill="#0e2a56"/>
  <rect x="14" y="9" width="1" height="1" fill="#ff6680"/>

  <!-- Thighs -->
  <rect x="0" y="10" width="1" height="1" fill="#ff6680"/>
  <rect x="1" y="10" width="3" height="1" fill="#0e2a56"/>
  <rect x="4" y="10" width="1" height="1" fill="#ff6680"/>
  <rect x="5" y="10" width="6" height="1" fill="#0e2a56"/>
  <rect x="11" y="10" width="1" height="1" fill="#ff6680"/>
  <rect x="12" y="10" width="3" height="1" fill="#0e2a56"/>
  <rect x="15" y="10" width="1" height="1" fill="#ff6680"/>

  <rect x="0" y="11" width="1" height="1" fill="#ff6680"/>
  <rect x="1" y="11" width="4" height="1" fill="#0e2a56"/>
  <rect x="5" y="11" width="6" height="1" fill="#0e2a56"/>
  <rect x="11" y="11" width="4" height="1" fill="#0e2a56"/>
  <rect x="15" y="11" width="1" height="1" fill="#ff6680"/>

  <!-- Feet -->
  <rect x="0" y="12" width="1" height="1" fill="#ff6680"/>
  <rect x="1" y="12" width="4" height="1" fill="#0e2a56"/>
  <rect x="5" y="12" width="1" height="1" fill="#ff6680"/>
  <rect x="6" y="12" width="4" height="1" fill="#0e2a56"/>
  <rect x="10" y="12" width="1" height="1" fill="#ff6680"/>
  <rect x="11" y="12" width="4" height="1" fill="#0e2a56"/>
  <rect x="15" y="12" width="1" height="1" fill="#ff6680"/>

  <!-- Toes -->
  <rect x="0" y="13" width="1" height="1" fill="#ff6680"/>
  <rect x="1" y="13" width="1" height="1" fill="#0e2a56"/>
  <rect x="2" y="13" width="1" height="1" fill="#ff6680"/>
  <rect x="3" y="13" width="1" height="1" fill="#0e2a56"/>
  <rect x="4" y="13" width="1" height="1" fill="#ff6680"/>
  <rect x="5" y="13" width="1" height="1" fill="#ff6680"/>
  <rect x="6" y="13" width="1" height="1" fill="#0e2a56"/>
  <rect x="7" y="13" width="1" height="1" fill="#ff6680"/>
  <rect x="8" y="13" width="1" height="1" fill="#0e2a56"/>
  <rect x="9" y="13" width="1" height="1" fill="#ff6680"/>
  <rect x="10" y="13" width="1" height="1" fill="#ff6680"/>
  <rect x="11" y="13" width="1" height="1" fill="#0e2a56"/>
  <rect x="12" y="13" width="1" height="1" fill="#ff6680"/>
  <rect x="13" y="13" width="1" height="1" fill="#0e2a56"/>
  <rect x="14" y="13" width="1" height="1" fill="#ff6680"/>
  <rect x="15" y="13" width="1" height="1" fill="#ff6680"/>

  <rect x="1" y="14" width="1" height="1" fill="#ff6680"/>
  <rect x="3" y="14" width="1" height="1" fill="#ff6680"/>
  <rect x="6" y="14" width="1" height="1" fill="#ff6680"/>
  <rect x="8" y="14" width="1" height="1" fill="#ff6680"/>
  <rect x="11" y="14" width="1" height="1" fill="#ff6680"/>
  <rect x="13" y="14" width="1" height="1" fill="#ff6680"/>
</svg>

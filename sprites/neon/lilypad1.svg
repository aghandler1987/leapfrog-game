<?xml version="1.0" encoding="UTF-8"?>
<!-- Neon lilypad — hot pink outline, dark fill. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 10" shape-rendering="crispEdges">
  <!-- Top edge -->
  <rect x="7"  y="0" width="2" height="1" fill="#ff6680"/>
  <rect x="9"  y="0" width="14" height="1" fill="#2a1040"/>
  <rect x="23" y="0" width="2" height="1" fill="#ff6680"/>

  <!-- Pink flower bud (top-right) -->
  <rect x="24" y="0" width="1" height="1" fill="#fcd800"/>

  <rect x="4"  y="1" width="3" height="1" fill="#ff6680"/>
  <rect x="7"  y="1" width="18" height="1" fill="#2a1040"/>
  <rect x="25" y="1" width="3" height="1" fill="#ff6680"/>

  <rect x="2"  y="2" width="2" height="1" fill="#ff6680"/>
  <rect x="4"  y="2" width="24" height="1" fill="#2a1040"/>
  <rect x="28" y="2" width="2" height="1" fill="#ff6680"/>

  <rect x="1"  y="3" width="2" height="1" fill="#ff6680"/>
  <rect x="3"  y="3" width="2" height="1" fill="#2a1040"/>
  <!-- notch cut on left (reveals dark water underneath via same fill) -->
  <rect x="5"  y="3" width="3" height="1" fill="#2a1040"/>
  <rect x="8"  y="3" width="21" height="1" fill="#2a1040"/>
  <rect x="29" y="3" width="2" height="1" fill="#ff6680"/>

  <rect x="0"  y="4" width="2" height="1" fill="#ff6680"/>
  <rect x="2"  y="4" width="2" height="1" fill="#2a1040"/>
  <rect x="4"  y="4" width="5" height="1" fill="#2a1040"/>
  <rect x="9"  y="4" width="21" height="1" fill="#2a1040"/>
  <rect x="30" y="4" width="2" height="1" fill="#ff6680"/>

  <rect x="1"  y="5" width="2" height="1" fill="#ff6680"/>
  <rect x="3"  y="5" width="2" height="1" fill="#2a1040"/>
  <rect x="5"  y="5" width="3" height="1" fill="#2a1040"/>
  <rect x="8"  y="5" width="22" height="1" fill="#2a1040"/>
  <rect x="30" y="5" width="1" height="1" fill="#ff6680"/>

  <rect x="2"  y="6" width="2" height="1" fill="#ff6680"/>
  <rect x="4"  y="6" width="24" height="1" fill="#2a1040"/>
  <rect x="28" y="6" width="2" height="1" fill="#ff6680"/>

  <rect x="4"  y="7" width="3" height="1" fill="#ff6680"/>
  <rect x="7"  y="7" width="18" height="1" fill="#2a1040"/>
  <rect x="25" y="7" width="3" height="1" fill="#ff6680"/>

  <rect x="7"  y="8" width="2" height="1" fill="#ff6680"/>
  <rect x="9"  y="8" width="14" height="1" fill="#2a1040"/>
  <rect x="23" y="8" width="2" height="1" fill="#ff6680"/>

  <!-- cyan reflection ripple -->
  <rect x="9"  y="9" width="2" height="1" fill="#58d8f8" opacity="0.5"/>
  <rect x="14" y="9" width="4" height="1" fill="#58d8f8" opacity="0.5"/>
  <rect x="22" y="9" width="2" height="1" fill="#58d8f8" opacity="0.5"/>
</svg>
